<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Replace HTTP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Just Replace HTTP</h1>
    
    <div class="add-pattern-section">
      <h2 data-i18n="addNewPattern">Add New Pattern</h2>
      <div class="input-group">
        <input type="text" id="patternName" data-i18n-placeholder="patternNamePlaceholder" placeholder="Pattern name (optional)">
      </div>
      <div class="input-group">
        <input type="text" id="originPattern" data-i18n-placeholder="originPatternPlaceholder" placeholder="Source pattern (regex)">
        <span class="arrow">=&gt;</span>
        <input type="text" id="targetPattern" data-i18n-placeholder="targetPatternPlaceholder" placeholder="Replacement string ($1 available)">
        <button id="addPattern" data-i18n="addButton">Add</button>
      </div>
    </div>

    <div class="patterns-section">
      <div class="section-header">
        <h2 data-i18n="patternList">Pattern List</h2>
        <div class="import-export-buttons">
          <button id="importBtn" class="import-export-btn" data-i18n="importButton">Import</button>
          <button id="exportBtn" class="import-export-btn" data-i18n="exportButton">Export</button>
        </div>
      </div>
      <div id="patternsList" class="patterns-list"></div>
    </div>

    <div class="no-patterns" id="noPatterns" data-i18n="noPatternsMessage" style="display: none;">
      No patterns. Please add a new pattern.
    </div>
    
    <input type="file" id="importFile" accept=".json" style="display: none;">
  </div>

  <script src="popup.js"></script>
</body>
</html>
